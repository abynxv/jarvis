[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-agent"
version = "0.1.0"
description = "Personal AI Agent for Ubuntu Linux"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "JARVIS Team" }]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
llm = [
    "ollama>=0.2.0",
    "openai>=1.30.0",
    "anthropic>=0.26.0",
    "google-genai>=0.1.0",
]
tools = [
    "duckduckgo-search>=5.3.0",
    "pypdf>=4.2.0",
    "pymupdf>=1.24.0",
]
voice = [
    "faster-whisper>=1.0.0",
    "edge-tts>=6.1.12",
    "sounddevice>=0.4.6",
    "numpy>=1.26.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
jarvis = "jarvis.cli.main:main"
